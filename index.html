
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="dashboard-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">

            <div class="sidebar-brand">
                <h2>EMS</h2>
                <p>Admin Panel</p>
            </div>

            <nav class="sidebar-nav">

                <a href="#dashboard" class="active"
                   onclick="setActiveMenu(this); closeSidebarOnMobile()">
                    🏠 Dashboard
                </a>

                <a href="#employeeFormSection"
                   onclick="setActiveMenu(this); closeSidebarOnMobile()">
                    ➕ Add Employee
                </a>

                <a href="#employeeListSection"
                   onclick="setActiveMenu(this); closeSidebarOnMobile()">
                    👥 Employees
                </a>

                <a href="#profileSection"
                   onclick="setActiveMenu(this); closeSidebarOnMobile()">
                    👤 Employee Profile
                </a>

            </nav>

            <div class="sidebar-footer">
                <p>Employee Management</p>
                <small>Version 1.0</small>
            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-content">

            <!-- HEADER -->
            <header>

                <div class="header-left">

                    <button
                        type="button"
                        class="menu-toggle"
                        onclick="toggleSidebar()"
                        aria-label="Toggle navigation menu"
                    >
                        ☰
                    </button>

                    <div>
                        <h2>Employee Management System</h2>
                        <p>Welcome to Admin Dashboard</p>
                    </div>

                </div>

                <button type="button" onclick="logout()">
                    Logout
                </button>

            </header>

            <main>

                <!-- DASHBOARD STATISTICS -->
                <section class="stats" id="dashboard">

                    <div class="card">
                        <h3>Total Employees</h3>
                        <h2 id="total">0</h2>
                    </div>

                    <div class="card">
                        <h3>IT Department</h3>
                        <h2 id="itCount">0</h2>
                    </div>

                    <div class="card">
                        <h3>HR Department</h3>
                        <h2 id="hrCount">0</h2>
                    </div>

                    <div class="card">
                        <h3>Average Salary</h3>
                        <h2 id="avgSalary">₹0</h2>
                    </div>

                </section>

                <!-- ADD EMPLOYEE FORM -->
                <section class="form-section" id="employeeFormSection">

                    <h2>Employee Details</h2>

                    <form id="employeeForm">

                        <input type="hidden" id="editId">

                        <label>Employee Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter employee name"
                            required
                        >

                        <label>Employee Photo</label>
                        <input
                            type="file"
                            id="photo"
                            accept="image/*"
                        >

                        <label>Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required
                        >

                        <label>Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required
                        >

                        <label>Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                        </select>

                        <label>Salary</label>
                        <input
                            type="number"
                            id="salary"
                            placeholder="Enter salary"
                            min="0"
                            required
                        >

                        <label>Joining Date</label>
                        <input
                            type="date"
                            id="joiningDate"
                            required
                        >

                        <label>Employee Status</label>
                        <select id="status" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>

                        <button type="submit" id="submitBtn">
                            Add Employee
                        </button>

                    </form>

                </section>

                <!-- EMPLOYEE LIST -->
                <section class="list-section" id="employeeListSection">

                    <h2>Employee List</h2>

                    <button
                        type="button"
                        onclick="exportEmployees()"
                        class="export-btn"
                    >
                        Export Employee Data
                    </button>

                    <button
                        type="button"
                        onclick="printEmployeeReport()"
                        class="print-btn"
                    >
                        Print Employee Report
                    </button>

                    <input
                        type="text"
                        id="search"
                        placeholder="Search employee..."
                    >

                    <select id="departmentFilter">
                        <option value="">All Departments</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                    </select>

                    <div id="employeeList">
                        <!-- Employee cards appear here -->
                    </div>

                </section>

                <!-- EMPLOYEE PROFILE -->
                <section
                    id="profileSection"
                    class="form-section"
                    style="display: none;"
                >

                    <h3>Employee Profile</h3>

                    <div id="profileDetails"></div>

                    <button
                        type="button"
                        onclick="closeProfile()"
                    >
                        Close Profile
                    </button>

                </section>

            </main>

        </div>

    </div>

    <!-- SIDEBAR JAVASCRIPT -->
    <script>

        function toggleSidebar() {
            document.getElementById("sidebar")
                .classList.toggle("sidebar-open");
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 767) {
                document.getElementById("sidebar")
                    .classList.remove("sidebar-open");
            }
        }

        function setActiveMenu(selectedLink) {
            document.querySelectorAll(".sidebar-nav a")
                .forEach(function(link) {
                    link.classList.remove("active");
                });

            selectedLink.classList.add("active");
        }

    </script>

</body>
</html>
